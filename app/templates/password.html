{% extends "base.html" %}
{% block content %}
<h1>تغییر رمز عبور</h1>
<form method="post" action="/password" class="card form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>رمز فعلی <input name="old" type="password" autocomplete="current-password" dir="ltr" required></label>
  <label>رمز جدید <small>(حداقل ۸ کاراکتر)</small><input name="new" type="password" autocomplete="new-password" dir="ltr" required minlength="8"></label>
  <label>تکرار رمز جدید <input name="new2" type="password" autocomplete="new-password" dir="ltr" required minlength="8"></label>
  <div class="form-actions"><button class="btn primary">ذخیره</button></div>
</form>
<p class="hint">بعد از تغییر رمز، حساب شما روی دستگاه‌های دیگر خارج می‌شود.</p>
{% endblock %}
