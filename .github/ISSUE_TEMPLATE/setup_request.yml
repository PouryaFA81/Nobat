name: "🛠️ Setup request / درخواست نصب"
description: Ask for paid help installing or running Nobat. / درخواست کمک برای نصب و راه‌اندازی (خدمت پولی).
title: "Setup request: "
labels: ["setup-request"]
body:
  - type: markdown
    attributes:
      value: |
        Installation and maintenance can be arranged as a **paid service**. Tell us what you need,
        and the maintainer will reply here to arrange a private conversation.

        ⚠️ This issue is **public**. Don't write phone numbers, email addresses, full names or patient information here.

        نصب و نگهداری به‌صورت **خدمت پولی** قابل هماهنگی است. نیازتان را بنویسید تا نگهدارنده‌ی پروژه
        در همین صفحه پاسخ دهد و گفت‌وگوی خصوصی هماهنگ شود.

        ⚠️ این صفحه **عمومی** است. شماره تلفن، ایمیل، نام کامل یا اطلاعات مراجعان را اینجا ننویسید.
  - type: dropdown
    id: type
    attributes:
      label: Type of practice / نوع مجموعه
      options:
        - Counseling / مشاوره
        - Medical clinic / مطب یا درمانگاه
        - Therapy / روان‌درمانی یا توان‌بخشی
        - Other / سایر
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Number of staff receiving appointments / تعداد همکارانی که نوبت می‌گیرند
      options:
        - "1–3"
        - "4–10"
        - "11–30"
        - "More than 30 / بیشتر از ۳۰"
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Do you have a server? / سرور دارید؟
      options:
        - "No, I need hosting too / نه، به میزبانی هم نیاز دارم"
        - "Yes, I have a server / بله، سرور دارم"
        - "Not sure / مطمئن نیستم"
    validations:
      required: true
  - type: checkboxes
    id: services
    attributes:
      label: What do you need? / به چه چیزهایی نیاز دارید؟
      options:
        - label: Installation / نصب
        - label: Ongoing maintenance and updates / نگهداری و به‌روزرسانی
        - label: Backups / پشتیبان‌گیری
        - label: Changes or custom features / تغییرات یا قابلیت اختصاصی
  - type: textarea
    id: details
    attributes:
      label: Anything else? / توضیحات بیشتر
      description: Language, timeline, questions... (no private details) / زبان، زمان‌بندی، سؤال‌ها... (بدون اطلاعات خصوصی)
